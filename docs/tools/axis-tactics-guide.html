<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DICE BOUND — 8軸×戦術分岐(A/B) ループ・コンボ構造設計資料</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --panel-2: #efece4;
    --panel-3: #e6e1d5;
    --ink: #1a1a1a;
    --ink-2: #454545;
    --ink-3: #76736b;
    --line: #d9d4c7;
    --accent: #b7472a;
    --accent-soft: #f5dfd7;
    --branch-a: #1f6feb;
    --branch-a-bg: #e7f0fd;
    --branch-b: #b84418;
    --branch-b-bg: #faeae2;
    --loop-col: #1a7f5a;
    --loop-bg: #e3f5ee;
    --r-bronze: #a15a2a;
    --r-silver: #6e7681;
    --r-gold:   #b58a1c;
    --r-leg:    #c93c20;
    --tag-bg: #ece7d8;
    --tag-fg: #4a4a4a;
    --shadow: 0 1px 0 rgba(0,0,0,0.03), 0 4px 14px rgba(30,20,10,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --panel: #1a1d23;
      --panel-2: #22262e;
      --panel-3: #2b303b;
      --ink: #eae7e0;
      --ink-2: #b9b6ae;
      --ink-3: #827f77;
      --line: #323742;
      --accent: #e57a5d;
      --accent-soft: #3a231e;
      --branch-a: #6cb0ff;
      --branch-a-bg: #192940;
      --branch-b: #ff9466;
      --branch-b-bg: #3b2219;
      --loop-col: #4ac99b;
      --loop-bg: #163329;
      --r-bronze: #ce8e5e;
      --r-silver: #c2c8d0;
      --r-gold:   #ebd467;
      --r-leg:    #ff7b61;
      --tag-bg: #2a2f38;
      --tag-fg: #c2bfb8;
      --shadow: 0 1px 0 rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f4ef; --panel: #ffffff; --panel-2: #efece4; --panel-3: #e6e1d5;
    --ink: #1a1a1a; --ink-2: #454545; --ink-3: #76736b; --line: #d9d4c7;
    --accent: #b7472a; --accent-soft: #f5dfd7;
    --branch-a: #1f6feb; --branch-a-bg: #e7f0fd;
    --branch-b: #b84418; --branch-b-bg: #faeae2;
    --loop-col: #1a7f5a; --loop-bg: #e3f5ee;
    --r-bronze: #a15a2a; --r-silver: #6e7681; --r-gold: #b58a1c; --r-leg: #c93c20;
    --tag-bg: #ece7d8; --tag-fg: #4a4a4a;
    --shadow: 0 1px 0 rgba(0,0,0,0.03), 0 4px 14px rgba(30,20,10,0.06);
  }
  :root[data-theme="dark"] {
    --bg: #121418; --panel: #1a1d23; --panel-2: #22262e; --panel-3: #2b303b;
    --ink: #eae7e0; --ink-2: #b9b6ae; --ink-3: #827f77; --line: #323742;
    --accent: #e57a5d; --accent-soft: #3a231e;
    --branch-a: #6cb0ff; --branch-a-bg: #192940;
    --branch-b: #ff9466; --branch-b-bg: #3b2219;
    --loop-col: #4ac99b; --loop-bg: #163329;
    --r-bronze: #ce8e5e; --r-silver: #c2c8d0; --r-gold: #ebd467; --r-leg: #ff7b61;
    --tag-bg: #2a2f38; --tag-fg: #c2bfb8;
    --shadow: 0 1px 0 rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); scroll-behavior: smooth; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.6;
    font-feature-settings: "palt";
  }

  .app { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh; }
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static !important; height: auto !important; border-right: none !important; border-bottom: 1px solid var(--line); }
  }

  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 20px 16px;
    position: sticky; top: 0; align-self: start;
    height: 100vh; overflow-y: auto;
  }
  main { padding: 24px 30px 80px; max-width: 1380px; min-width: 0; }

  h1 { font-size: 12px; letter-spacing: 0.1em; margin: 0; font-weight: 700; text-transform: uppercase; color: var(--accent); }
  h1 .sub { display: block; font-size: 18px; color: var(--ink); text-transform: none; letter-spacing: 0; margin-top: 3px; line-height: 1.3; }
  .meta { color: var(--ink-3); font-size: 12px; margin: 8px 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

  .ctrl-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  .ctrl-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    padding: 5px 10px; font-size: 12px; font-weight: 600; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
    cursor: pointer; transition: 0.15s;
  }
  .btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .nav-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 3px; }
  .nav-link {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--ink-2);
    font-size: 13px; font-weight: 600; border: 1px solid transparent; transition: 0.12s;
  }
  .nav-link:hover { background: var(--panel-2); color: var(--ink); }
  .nav-link.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .nav-sub { font-size: 11px; color: var(--ink-3); font-weight: 400; }

  /* Sections */
  .section-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 22px 24px; margin-bottom: 28px; box-shadow: var(--shadow);
  }
  .axis-header {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 10px; border-bottom: 2px solid var(--line); padding-bottom: 12px; margin-bottom: 16px;
  }
  .axis-title { font-size: 22px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 10px; }
  .axis-badge {
    font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .axis-count { font-size: 12px; color: var(--ink-3); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Core Rule & Terminals Box */
  .rule-grid {
    display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; margin-bottom: 18px;
  }
  @media (max-width: 860px) { .rule-grid { grid-template-columns: 1fr; } }
  .info-box {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
  }
  .info-box h4 {
    margin: 0 0 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 700;
  }
  .formula-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink); }
  .formula-list li { margin-bottom: 4px; }
  .term-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 10px; margin-top: 6px; font-size: 12.5px;
  }
  .term-card strong { color: var(--accent); }
  .term-up { color: var(--ink-3); font-size: 12px; display: block; margin-top: 2px; }

  /* Shared Engine Pipeline */
  .shared-strip {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--loop-col);
    border-radius: 8px; padding: 12px 15px; margin-bottom: 18px;
  }
  .shared-strip-title {
    font-size: 12.5px; font-weight: 800; color: var(--loop-col); margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .pipeline-stages {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  @media (max-width: 860px) { .pipeline-stages { grid-template-columns: 1fr; } }
  .pipe-stage {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; position: relative;
  }
  .pipe-stage-label { font-size: 11px; font-weight: 700; color: var(--ink-3); margin-bottom: 4px; display: block; }
  .pipe-stage-body { font-size: 12.5px; line-height: 1.55; }

  /* A vs B Side-by-Side */
  .ab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  @media (max-width: 960px) { .ab-grid { grid-template-columns: 1fr; } }

  .branch-col {
    border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--panel);
    display: flex; flex-direction: column; gap: 12px;
  }
  .branch-col.br-a { border-top: 4px solid var(--branch-a); }
  .branch-col.br-b { border-top: 4px solid var(--branch-b); }

  .br-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .br-tag-a { background: var(--branch-a-bg); color: var(--branch-a); font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 5px; }
  .br-tag-b { background: var(--branch-b-bg); color: var(--branch-b); font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 5px; }
  .br-name { font-size: 16px; font-weight: 800; }
  .br-archetype { font-size: 12px; color: var(--ink-3); font-weight: 600; }

  /* Flowchart Nodes */
  .flow-stack { display: flex; flex-direction: column; gap: 0; }
  .flow-node {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  .flow-node.loop-node {
    border-color: var(--loop-col); background: var(--loop-bg);
  }
  .flow-node.finisher-node {
    border-width: 1.5px; border-color: var(--accent); background: var(--accent-soft);
  }
  .flow-step-hdr {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
    font-size: 11.5px; font-weight: 800; letter-spacing: 0.03em;
  }
  .flow-node.loop-node .flow-step-hdr { color: var(--loop-col); }
  .flow-node.finisher-node .flow-step-hdr { color: var(--accent); }
  .flow-desc { font-size: 13px; line-height: 1.55; color: var(--ink); }
  .flow-arrow {
    text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-3);
    padding: 3px 0; user-select: none;
  }
  .flow-arrow.loop-back { color: var(--loop-col); }

  /* Walkthrough Example Box */
  .combo-example {
    background: var(--panel-2); border: 1px dashed var(--line); border-radius: 8px;
    padding: 11px 13px; font-size: 12.5px; line-height: 1.6;
  }
  .combo-example-title {
    font-weight: 800; font-size: 12px; color: var(--ink-2); margin-bottom: 5px;
    display: flex; align-items: center; gap: 6px;
  }
  .combo-math {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 9px; margin-top: 6px; font-size: 12px; color: var(--ink);
  }
  .matchup-note { font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 8px; margin-top: auto; }

  /* Inline Item Pills with Pixel Icons */
  .item-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 6px 1px 4px; margin: 1px 2px; border-radius: 5px;
    background: var(--panel); border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 700; vertical-align: baseline;
    cursor: help; position: relative; white-space: nowrap;
  }
  .item-pill img {
    width: 16px; height: 16px; image-rendering: pixelated; flex-shrink: 0;
  }
  .item-pill[data-rar="BRONZE"] { border-left: 3px solid var(--r-bronze); }
  .item-pill[data-rar="SILVER"] { border-left: 3px solid var(--r-silver); }
  .item-pill[data-rar="GOLD"]   { border-left: 3px solid var(--r-gold); }
  .item-pill[data-rar="LEGENDARY"] { border-left: 3px solid var(--r-leg); }
  .new-badge {
    font-size: 10px; font-weight: 800; padding: 0 4px; border-radius: 3px;
    background: var(--accent); color: #fff; margin-left: 2px;
  }

  /* Floating Tooltip */
  #tooltip {
    position: fixed; z-index: 9999; pointer-events: none; display: none;
    max-width: 340px; background: var(--panel); color: var(--ink);
    border: 1.5px solid var(--accent); border-radius: 8px; padding: 10px 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35); font-size: 12.5px; line-height: 1.5;
  }
  #tooltip .tt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-weight: 800; font-size: 13.5px; }
  #tooltip .tt-head img { width: 24px; height: 24px; image-rendering: pixelated; }
  #tooltip .tt-meta { font-size: 11px; color: var(--ink-3); font-weight: 600; margin-bottom: 5px; }

  /* Full Item Reference Grid inside each axis */
  details.catalog-details {
    border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px;
  }
  details.catalog-details summary {
    cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink-2); user-select: none;
  }
  .cat-subhead {
    font-size: 12px; font-weight: 800; color: var(--ink-3); margin: 12px 0 6px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .relic-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px;
  }
  .relic-card {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 10px; display: flex; gap: 9px; align-items: flex-start;
  }
  .relic-card[data-rar="BRONZE"] { border-left: 3.5px solid var(--r-bronze); }
  .relic-card[data-rar="SILVER"] { border-left: 3.5px solid var(--r-silver); }
  .relic-card[data-rar="GOLD"]   { border-left: 3.5px solid var(--r-gold); }
  .relic-card[data-rar="LEGENDARY"] { border-left: 3.5px solid var(--r-leg); }
  .relic-icon-box {
    width: 32px; height: 32px; border-radius: 5px; background: var(--panel);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .relic-icon-box img { width: 24px; height: 24px; image-rendering: pixelated; }
  .relic-body { min-width: 0; flex: 1; }
  .relic-title { font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .relic-rar { font-size: 10.5px; font-family: monospace; color: var(--ink-3); }
  .relic-desc { font-size: 12px; color: var(--ink-2); margin-top: 3px; line-height: 1.45; }

  /* Matrix Table */
  .matrix-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
  .matrix-table th, .matrix-table td {
    border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top;
  }
  .matrix-table th { background: var(--panel-2); font-weight: 800; }
</style>
</head>
<body>
<div id="tooltip"></div>
<div class="app">
  <aside>
    <h1>DICE BOUND <span class="sub">8軸×戦術分岐(A/B)<br>ループ＆コンボ構造図鑑</span></h1>
    <div class="meta">2026-11-26 最新コード・items.json 準拠<br>秘宝名にカーソルを合わせるとアイコンと効果全文を表示します。</div>

    <div class="ctrl-group">
      <span class="ctrl-label">表示モード</span>
      <div class="btn-row">
        <button id="mode-all" class="btn active" onclick="setViewMode('all')">全軸一覧</button>
        <button id="mode-single" class="btn" onclick="setViewMode('single')">1軸集中</button>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">表示オプション</span>
      <div class="btn-row">
        <button class="btn" onclick="toggleTheme()">明暗テーマ切替</button>
        <button class="btn" onclick="toggleAllCatalogs()">秘宝一覧 全開閉</button>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">セクション移動</span>
      <ul id="nav-list" class="nav-list"></ul>
    </div>
  </aside>

  <main id="main-content"></main>

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function iconPath(it) {
  if (!it) return '';
  return `../../Assets/Resources/Icons/Items/${encodeURIComponent(it.id)}.png`;
}

// Convert double-bracket item tokens inside text into interactive pixel-art pills
function richText(str) {
  return esc(str).replace(/\[\[([^\]]+)\]\]/g, (_, name) => {
    const it = ITEM_MAP[name];
    const rar = it ? (it.rarity || '') : '';
    const isNew = UPDATED_ITEMS.has(name);
    const img = it
      ? `<img src="${iconPath(it)}" alt="" onerror="this.style.display='none'">`
      : '';
    const badge = isNew ? `<span class="new-badge">★更新</span>` : '';
    return `<span class="item-pill" data-item="${esc(name)}" data-rar="${esc(rar)}">${img}${esc(name)}${badge}</span>`;
  }).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

          <td>長期戦・装甲割りに強く、今回の初速＆防御0常時化バフで序盤雑魚戦の取りこぼしも解消。</td>
        </tr>
        <tr>

          <td><strong>〈間合〉</strong>攻撃出目+25/40/60%＆敵の固定削り打ち消し。<strong>〈一対一〉</strong>単体戦で最終+10/18%・防御+3/+5。T4<strong>〈切り返し〉〈不滅の刃〉</strong>で「攻撃と防御の両方に挿す」たびブロック60%を攻撃加算＆最終最大+72%。</td>
          <td><strong>充電A</strong>（二股の導線＋逆さ避雷針で攻防両立を毎ターン維持）<br><strong>毒A・出血A・会心A</strong>（癖がなく全軸の基準値を一段引き上げる万能型）</td>
          <td>極端な弱点なし。「攻撃1枚だけ＆防御0枚」に偏る瞬間よりも攻防スプリット配線で真価。</td>
        </tr>
        <tr>
          <td><strong>短剣（アサシン）</strong><br>${richText("[[盗賊の短刀]] → [[処刑人の曲刀]] → [[ノクタリア]]")}</td>
          <td>基礎会心15〜25%・高貫通（防御0）。<strong>〈疾手〉</strong>開幕5ターン攻撃+4/+6/+9＆初手手札+1/+2。T3<strong>〈連刃〉</strong>攻撃2枚以上で防御無視の追撃+1回。T4<strong>〈急所〉〈処刑〉</strong>で瀕死ボス10%処刑。</td>
          <td><strong>会心A</strong>（勝率42.6%・蹂躙21.2%の最強タッグ！高会心＋連刃＋急所）<br><strong>毒B</strong>（開幕5T暗殺タイムが〈疾手〉5Tと完全同期・蹂躙23.3%！）<br><strong>出血A・臨界A</strong>（連刃の追加ヒットで3撃条件を即達成）</td>
          <td>基礎防御が <code>[0,0]</code> のため、<strong>山札B・シールドB</strong>のような長期受け回し型とは相性が悪い（被弾負けしやすい）。</td>

          <td>最高基礎防御 <code>[3,4]〜[8,9]</code>。<strong>〈城壁〉</strong>余りブロックの60/90/120%をシールド変換（ジャストなら+8/+12/+16）。T3<strong>〈シールドバッシュ〉</strong>防御なし攻撃Tにシールドを攻撃へ変換。T4<strong>〈黎明〉</strong>完封で敵最大HP削り。</td>
          <td><strong>シールドA / B</strong>（城壁で毎T自動シールド供給＆ジャストボーナス重複）<br><strong>山札A / B</strong>（Knight勝率36〜38%！高基礎防御でカード構築の隙を完全カバー）<br><strong>充電B・毒A</strong>（耐久して大技を溜める軸全般）</td>

          <td>攻撃を2枚以上並べる多段系（出血A・会心A・充電A）とは排他。見かけたら1撃特化へ舵を切る象徴武器。</td>

}

function renderBranchCol(br, letter) {
  const cls = letter === 'A' ? 'br-a' : 'br-b';
  const tagCls = letter === 'A' ? 'br-tag-a' : 'br-tag-b';
  const nodesHtml = br.nodes.map((nd, idx) => {
    const nodeCls = nd.kind === 'loop' ? 'flow-node loop-node'
                  : nd.kind === 'finisher' ? 'flow-node finisher-node'
                  : 'flow-node';
    const rightBadge = nd.kind === 'loop' ? '<span>🔄 コアループ</span>'
                     : nd.kind === 'finisher' ? '<span>💥 FINISHER</span>' : '';
    const arrow = idx < br.nodes.length - 1
      ? `<div class="flow-arrow ${nd.kind === 'loop' ? 'loop-back' : ''}">${nd.loopLabel ? esc(nd.loopLabel) + ' ／ ↓' : '▼'}</div>`
      : (nd.loopLabel ? `<div class="flow-arrow loop-back">${esc(nd.loopLabel)}</div>` : '');
    return `
      <div class="${nodeCls}">
        <div class="flow-step-hdr"><span>${esc(nd.step)}</span>${rightBadge}</div>
        <div class="flow-desc">${richText(nd.text)}</div>
      </div>
      ${arrow}`;
  }).join('');

  return `
    <div class="branch-col ${cls}">
      <div class="br-head">
        <div>
          <span class="${tagCls}">分岐 ${letter}</span>
          <span class="br-name">〈${esc(br.name)}〉</span>
        </div>
        <span class="br-archetype">${esc(br.archetype)}</span>
      </div>
      <div class="flow-stack">${nodesHtml}</div>
      <div class="combo-example">
        <div class="combo-example-title">⚡ ${esc(br.exampleTitle)}</div>
        <div>${richText(br.exampleText)}</div>
        <pre class="combo-math" style="white-space:pre-wrap;margin:6px 0 0;">${esc(br.exampleMath)}</pre>
      </div>
      <div class="matchup-note"><strong>運用・相性：</strong>${esc(br.matchup)}</div>
    </div>`;
}

function renderAxisCatalog(axisName) {
  const rarRank = { BRONZE: 0, SILVER: 1, GOLD: 2, LEGENDARY: 3 };
  const belong = RAW_ITEMS.filter(it => it.category === 'Passive' && it.axis === axisName)
    .sort((a, b) => (rarRank[a.rarity] ?? 9) - (rarRank[b.rarity] ?? 9) || a.name.localeCompare(b.name, 'ja'));
  const groups = [
    { label: `分岐 A 専用秘宝`, list: belong.filter(x => x.branch === 'A') },
    { label: `分岐 B 専用秘宝`, list: belong.filter(x => x.branch === 'B') },
    { label: `軸共通エンジン秘宝`, list: belong.filter(x => !x.branch) }
  ];

  const renderGroup = g => `
    <div class="cat-subhead">${esc(g.label)}（${g.list.length}品）</div>
    <div class="relic-grid">
      ${g.list.map(it => `
        <div class="relic-card" data-rar="${esc(it.rarity)}">
          <div class="relic-icon-box">
            <img src="${iconPath(it)}" alt="" onerror="this.style.display='none'">
          </div>
          <div class="relic-body">
            <div class="relic-title">
              <span>${esc(it.name)}</span>
              ${UPDATED_ITEMS.has(it.name) ? '<span class="new-badge">★更新</span>' : ''}
              <span class="relic-rar">${esc(it.rarity)} · ${it.basePrice || 0}G</span>
            </div>
            <div class="relic-desc">${esc(it.description)}</div>
          </div>
        </div>
      `).join('')}
    </div>`;

  return `
    <details class="catalog-details">
      <summary>📦 ${esc(axisName)}軸の所属秘宝 全 ${belong.length} 品を表示（A: ${groups[0].list.length} / B: ${groups[1].list.length} / 共通: ${groups[2].list.length}）</summary>
      ${groups.map(renderGroup).join('')}
    </details>`;
}

function renderAxisSection(sec) {
  const belong = RAW_ITEMS.filter(it => it.category === 'Passive' && it.axis === sec.axis);
  const cntA = belong.filter(x => x.branch === 'A').length;
  const cntB = belong.filter(x => x.branch === 'B').length;
  const cntS = belong.filter(x => !x.branch).length;

  return `
  <section id="${sec.id}" class="section-card axis-section">
    <div class="axis-header">
      <div>
        <h2 class="axis-title">${esc(sec.navTitle)} <span class="axis-badge">${esc(sec.subtitle)}</span></h2>
      </div>
      <span class="axis-count">全 ${belong.length} 品（分岐A:${cntA} / 分岐B:${cntB} / 共通:${cntS}）</span>
    </div>

    <div class="rule-grid">
      <div class="info-box">
        <h4>基本メカニクス・計算式</h4>
        <ul class="formula-list">
          ${sec.coreFormulas.map(f => `<li>${richText(f)}</li>`).join('')}
        </ul>
      </div>
      <div class="info-box">
        <h4>軸専用 端子カード（ロック連動出現）</h4>
        ${sec.terminals.map(t => `
          <div class="term-card">
            <strong>〈${esc(t.name)}〉</strong>：${esc(t.normal)}
            <span class="term-up">${esc(t.up)}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="shared-strip">
      <div class="shared-strip-title">⚙️ 両分岐を支える共通エンジン（B / S / G / L 共通枠 ${cntS} 品）</div>
      <div class="pipeline-stages">
        ${sec.sharedStages.map(st => `
          <div class="pipe-stage">
            <span class="pipe-stage-label">${esc(st.label)}</span>
            <div class="pipe-stage-body">${richText(st.text)}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="ab-grid">
      ${renderBranchCol(sec.branchA, 'A')}
      ${renderBranchCol(sec.branchB, 'B')}
    </div>

    ${renderAxisCatalog(sec.axis)}
  </section>`;
}

// Navigation & View Mode
let viewMode = 'all';
let activeSecId = 'overview';

function renderAll() {
  const nav = document.getElementById('nav-list');
  nav.innerHTML = SECTIONS.map(s => `
    <li>
      <a href="#${s.id}" class="nav-link ${s.id === activeSecId ? 'active' : ''}" onclick="onNavClick(event, '${s.id}')">
        <span>${esc(s.navTitle)}</span>
        <span class="nav-sub">${esc(s.navSub)}</span>
      </a>
    </li>
  `).join('');

  const main = document.getElementById('main-content');
  const list = viewMode === 'single' ? SECTIONS.filter(s => s.id === activeSecId) : SECTIONS;
  main.innerHTML = list.map(s => s.isOverview ? renderOverview() : s.isWeapons ? renderWeapons() : renderAxisSection(s)).join('');
}

function setViewMode(m) {
  viewMode = m;
  document.getElementById('mode-all').classList.toggle('active', m === 'all');
  document.getElementById('mode-single').classList.toggle('active', m === 'single');
  renderAll();
}

function onNavClick(e, id) {
  activeSecId = id;
  if (viewMode === 'single') {
    e.preventDefault();
    renderAll();
    window.scrollTo({ top: 0, behavior: 'instant' });
  } else {
    document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
  }
}

function toggleTheme() {
  const cur = document.documentElement.dataset.theme;
  const isDark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
}

let allOpen = false;
function toggleAllCatalogs() {
  allOpen = !allOpen;
  document.querySelectorAll('details.catalog-details').forEach(d => d.open = allOpen);
}

// Floating Tooltip for .item-pill
const tt = document.getElementById('tooltip');
document.addEventListener('mouseover', e => {
  const pill = e.target.closest('.item-pill');
  if (!pill) { tt.style.display = 'none'; return; }
  const it = ITEM_MAP[pill.dataset.item];
  if (!it) return;
  const br = it.branch ? ` ／ 分岐 ${it.branch}` : (it.axis ? ' ／ 軸共通' : '');
  const imgHtml = `<img src="${iconPath(it)}" onerror="this.style.display='none'">`;
  tt.innerHTML = `
    <div class="tt-head">${imgHtml}<span>${esc(it.name)}</span></div>
    <div class="tt-meta">${esc(it.category)} · ${esc(it.rarity || '')}${it.axis ? ' · ' + esc(it.axis) + esc(br) : ''}</div>
    <div>${esc(it.description || '')}</div>
  `;
  tt.style.display = 'block';
});
document.addEventListener('mousemove', e => {
  if (tt.style.display !== 'block') return;
  const x = Math.min(window.innerWidth - 360, e.clientX + 14);
  const y = Math.min(window.innerHeight - 160, e.clientY + 14);
  tt.style.left = Math.max(8, x) + 'px';
  tt.style.top = Math.max(8, y) + 'px';
});

renderAll();
</script>
</body>
</html>
